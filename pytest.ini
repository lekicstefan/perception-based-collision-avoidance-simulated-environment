[pytest]
# Only testing/tests is collected. Scripts in testing/tools are run by hand and never picked up by accident.
testpaths = testing/tests
# The repository root is on the import path, so `server` and `testing` import as packages from anywhere.
pythonpath = .
# importlib mode: test files need no __init__.py and may share a file name in different folders.
addopts = --import-mode=importlib -q
python_files = test_*.py